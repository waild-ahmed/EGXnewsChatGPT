name: Mubasher Telegram Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mubasher-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/monitor.py

      - name: Update heartbeat
        if: github.event_name == 'schedule'
        run: |
          mkdir -p .github
          printf '%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/heartbeat.txt

      - name: Verify state changes
        run: |
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"
          git status --short

          echo ""
          echo "========================================"
          echo "SENT NEWS DIFF"
          echo "========================================"
          git diff -- sent_news.json || true

          echo ""
          echo "========================================"
          echo "SENT NEWS FILE"
          echo "========================================"

          if [ -f sent_news.json ]; then
            cat sent_news.json
          else
            echo "ERROR: sent_news.json does not exist!"
            exit 1
          fi

      - name: Commit and push state
        run: |
          git config user.name "mubasher-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_news.json .github/heartbeat.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "Changes ready to commit:"
          git diff --cached --stat

          git commit -m "Update monitor state"

          echo "Pushing changes to GitHub..."

          git push

          echo "========================================"
          echo "STATE PUSHED SUCCESSFULLY"
          echo "========================================"
