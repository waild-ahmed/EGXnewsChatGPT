name: Mubasher Telegram Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mubasher-monitor
  cancel-in-progress: false

jobs:

  monitor:

    runs-on: ubuntu-slim

    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/monitor.py

      - name: Save state
        run: |
          if git diff --quiet -- sent_news.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "mubasher-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_news.json

          git commit -m "Update sent news state"

          git push
